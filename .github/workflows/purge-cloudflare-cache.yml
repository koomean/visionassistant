name: Purge Cloudflare cache after Pages build

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: site-cache-purge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the published Pages build
        id: pages
        env:
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const output = process.env.GITHUB_OUTPUT;
          async function main() {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pages/builds/latest`, {
              headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GITHUB_TOKEN}`, 'user-agent': 'koomean-site-cache-purge' },
            });
            if (!response.ok) throw new Error(`GitHub Pages API returned HTTP ${response.status}`);
            const build = await response.json();
            if (build.status !== 'built') {
              console.log(`Latest Pages build status is ${build.status}; cache purge skipped.`);
              fs.appendFileSync(output, 'ready=false\n');
              return;
            }
            if (build.commit !== process.env.EXPECTED_COMMIT) {
              console.log('Latest Pages build does not match this workflow revision; cache purge skipped.');
              fs.appendFileSync(output, 'ready=false\n');
              return;
            }
            console.log('Confirmed the Pages build for this revision.');
            fs.appendFileSync(output, 'ready=true\n');
          }
          main().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Purge only this website's document URLs
        if: steps.pages.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: e18e4081ccde88866bbe5c44a1053568
          SITE_HOST: visionassistant.koomean.com
        run: |
          node <<'NODE'
          async function main() {
            if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('CLOUDFLARE_API_TOKEN secret is not configured');
            const files = [`https://${process.env.SITE_HOST}/`, `https://${process.env.SITE_HOST}/index.html`];
            const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${process.env.CLOUDFLARE_ZONE_ID}/purge_cache`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ files }),
            });
            const result = await response.json();
            if (!response.ok || !result.success) {
              const errors = (result.errors || []).map((item) => item.message).join('; ');
              throw new Error(`Cloudflare purge failed (HTTP ${response.status})${errors ? `: ${errors}` : ''}`);
            }
            console.log(`Cloudflare accepted a targeted purge for ${files.length} URLs on ${process.env.SITE_HOST}.`);
          }
          main().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
