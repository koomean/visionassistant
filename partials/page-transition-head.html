  <!-- page-transition:start -->
  <script>(()=>{
    const root=document.documentElement,key='lunav-page-transition';
    let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,saved,pending,storage=true;
    try{saved=localStorage.getItem('lunav-language');reduced=reduced||localStorage.getItem('lunav-reduce-motion')==='true'}catch{}
    const requested=new URLSearchParams(location.search).get('lang');
    const language=(requested||saved||root.lang)==='en'?'en':'th';
    root.dataset.pageTransitionLanguage=language;
    root.dataset.pageTransitionLabel=language==='en'?'Finding a path to the stars':'กำลังหาเส้นทางไปยังดวงดาว';
    if(!reduced&&location.pathname==='/contact.html'){root.classList.add('contact-entry-pending');setTimeout(()=>root.classList.remove('contact-entry-pending'),1200)}
    try{
      const value=sessionStorage.getItem(key);sessionStorage.removeItem(key);
      if(value)try{pending=JSON.parse(value)}catch{}
      if(!pending){sessionStorage.setItem(key+'-probe','1');sessionStorage.removeItem(key+'-probe')}
    }catch{storage=false}
    let fallback=false;
    if(!storage)try{
      const from=new URL(document.referrer),known=path=>/^\/(?:index\.html|contact\.html|project-status\.html|licensing\.html|credits\.html|404\.html)?$/.test(path);
      fallback=from.origin===location.origin&&known(from.pathname)&&known(location.pathname)&&((from.pathname==='/contact.html')!==(location.pathname==='/contact.html'));
    }catch{}
    const age=pending?Date.now()-pending.time:Infinity;
    if(!(pending&&pending.to===location.href&&age>=0&&age<7000)&&!fallback)return;
    root.dataset.pageTransitionArrival='true';
    if(reduced)return;
    root.classList.add('page-arriving');
    setTimeout(()=>root.classList.remove('page-arriving','page-arrival-reveal'),1500);
  })();</script>

  <!-- page-transition:end -->
